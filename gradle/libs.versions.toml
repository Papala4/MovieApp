[versions]
agp                         = "9.1.1"
kotlin                      = "2.3.20"
ksp                         = "2.3.2"
compose-bom                 = "2024.06.00"
koin                        = "3.5.6"
koin-compose                = "3.5.6"
retrofit                    = "2.11.0"
okhttp                      = "4.12.0"
kotlinx-serialization       = "1.7.1"
retrofit-kotlinx-serialization = "1.0.0"
room                        = "2.6.1"
datastore                   = "1.1.1"
navigation                  = "2.7.7"
lifecycle                   = "2.8.2"
coroutines                  = "1.8.1"
coil                        = "2.6.0"
timber                      = "5.0.1"
turbine                     = "1.1.0"
mockk                       = "1.13.11"
kotest                      = "5.9.1"
core-ktx = "1.19.0"
junit = "1.3.0"
espresso-core = "3.7.0"
appcompat = "1.6.1"
material = "1.10.0"
runtime = "1.11.2"

[libraries]
android-gradlePlugin            = { group = "com.android.tools.build", name = "gradle",                              version.ref = "agp" }
kotlin-gradlePlugin             = { group = "org.jetbrains.kotlin",    name = "kotlin-gradle-plugin",                version.ref = "kotlin" }
ksp-gradlePlugin                = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin",     version.ref = "ksp" }
compose-bom                     = { group = "androidx.compose",            name = "compose-bom",                version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-tooling              = { group = "androidx.compose.ui",         name = "ui-tooling" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3",  name = "material3" }
compose-foundation              = { group = "androidx.compose.foundation", name = "foundation" }
activity-compose                = { group = "androidx.activity",           name = "activity-compose",           version = "1.9.0" }
navigation-compose              = { group = "androidx.navigation",         name = "navigation-compose",          version.ref = "navigation" }
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",         version.ref = "lifecycle" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",           version.ref = "lifecycle" }
koin-androidx-compose           = { group = "io.insert-koin", name = "koin-androidx-compose",                   version.ref = "koin-compose" }
koin-test                       = { group = "io.insert-koin", name = "koin-test",                               version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version = "3.5.3" }
koin-android = { module = "io.insert-koin:koin-android", version = "3.5.3" }
retrofit-core                   = { group = "com.squareup.retrofit2",    name = "retrofit",                     version.ref = "retrofit" }
retrofit-kotlinx-serialization  = { group = "com.jakewharton.retrofit",  name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serialization" }
okhttp-core                     = { group = "com.squareup.okhttp3",      name = "okhttp",                       version.ref = "okhttp" }
okhttp-logging                  = { group = "com.squareup.okhttp3",      name = "logging-interceptor",          version.ref = "okhttp" }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",   version.ref = "kotlinx-serialization" }
room-runtime                    = { group = "androidx.room", name = "room-runtime",                             version.ref = "room" }
room-ktx                        = { group = "androidx.room", name = "room-ktx",                                 version.ref = "room" }
room-compiler                   = { group = "androidx.room", name = "room-compiler",                            version.ref = "room" }
datastore-preferences           = { group = "androidx.datastore", name = "datastore-preferences",               version.ref = "datastore" }
coroutines-android              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
coroutines-test                 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",          version.ref = "coroutines" }
coil-compose                    = { group = "io.coil-kt", name = "coil-compose",                                version.ref = "coil" }
timber                          = { group = "com.jakewharton.timber", name = "timber",                          version.ref = "timber" }
turbine                         = { group = "app.cash.turbine",   name = "turbine",                             version.ref = "turbine" }
mockk                           = { group = "io.mockk",           name = "mockk",                               version.ref = "mockk" }
kotest-runner                   = { group = "io.kotest",          name = "kotest-runner-junit5",                version.ref = "kotest" }
kotest-assertions               = { group = "io.kotest",          name = "kotest-assertions-core",              version.ref = "kotest" }
junit                           = { group = "junit",              name = "junit",                               version = "4.13.2" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

[plugins]
android-application             = { id = "com.android.application",                              version.ref = "agp" }
android-library                 = { id = "com.android.library",                                  version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",                         version.ref = "kotlin" }
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm",                             version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization",            version.ref = "kotlin" }
compose-compiler                = { id = "org.jetbrains.kotlin.plugin.compose",                  version.ref = "kotlin" }
ksp                             = { id = "com.google.devtools.ksp",                              version.ref = "ksp" }


[bundles]
compose-ui      = ["compose-ui", "compose-material3", "compose-foundation", "compose-ui-tooling-preview", "activity-compose"]
lifecycle       = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]
networking      = ["retrofit-core", "retrofit-kotlinx-serialization", "okhttp-core", "okhttp-logging", "kotlinx-serialization-json"]
room            = ["room-runtime", "room-ktx"]
koin-compose    = ["koin-android", "koin-androidx-compose"]
testing         = ["turbine", "mockk", "kotest-runner", "kotest-assertions", "coroutines-test", "koin-test"]
