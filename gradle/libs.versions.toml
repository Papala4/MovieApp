movieapp-android-feature = {id = "movieapp.android.feature"}
android-built-in1-kotlin = { id = "com.android.built-in-kotlin", version.ref = "android-built-in1-kotlin" }


[bundles]
compose-ui = ["compose-ui", "compose-material3", "compose-foundation", "compose-ui-tooling-preview", "activity-compose"]
lifecycle = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]
networking = ["retrofit-core", "retrofit-kotlinx-serialization", "okhttp-core", "okhttp-logging", "kotlinx-serialization-json"]
room = ["room-runtime", "room-ktx"]
koin-compose = ["koin-android", "koin-androidx-compose"]
testing = ["turbine", "mockk", "kotest-runner", "kotest-assertions", "coroutines-test", "koin-test"]
